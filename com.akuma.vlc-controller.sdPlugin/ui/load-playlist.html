<!DOCTYPE html>
<html>

<head lang="en">
	<title>Load Playlist Settings</title>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
	<sdpi-item label="VLC Host">
		<sdpi-textfield setting="host" global placeholder="127.0.0.1"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Port">
		<sdpi-textfield setting="port" global placeholder="8080"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Password">
		<sdpi-password setting="password" global></sdpi-password>
	</sdpi-item>

	<sdpi-item label="Playlist File">
		<sdpi-file setting="playlistPath"></sdpi-file>
	</sdpi-item>
</body>

</html>
